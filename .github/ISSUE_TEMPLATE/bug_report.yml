name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials.** Remove `api_key`, `auth_password` and
        similar values from configuration and logs before posting, and do not
        attach `config.local.yaml` or `.env`. Do not attach confidential
        documents; a small made-up example that shows the problem is best.
        Security problems: please use private vulnerability reporting
        (see SECURITY.md), not an issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Input type (text/file, format), source and target language, mode and style, glossary used?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model server and model
      description: e.g. Ollama 0.x with model y, vLLM with model z
  - type: textarea
    id: config
    attributes:
      label: Changed configuration
      description: Only the keys you changed (from config.local.yaml or environment), without credentials.
      render: yaml
  - type: textarea
    id: status
    attributes:
      label: Status line shown in the interface
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Relevant lines of translation_app.log around the problem, without credentials.
      render: text
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
