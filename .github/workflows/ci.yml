# Runs the checks defined as "checked" in CONTRIBUTING.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Syntax
        run: python -m compileall -q main.py src tests tools
      - name: Import
        run: python -c "import src.app"
      - name: Tests
        run: python -m pytest -q
      - name: Repository checks (links, runtime state, version, SPDX, wording)
        run: python tools/check_repo.py
